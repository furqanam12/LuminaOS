<!DOCTYPE html>
<html class="dark"><head><meta charset="utf-8"><title>Task View</title>
<link rel="stylesheet" href="css/lumina.css"><style>
body { margin: 0; padding: 0; background: transparent; height: 100%; overflow: hidden; }
.taskview { position: fixed; inset: 0; display: grid; grid-template-rows: 44px 1fr; }
.header { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg-win); border-bottom: 1px solid var(--line-2); }
.header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.header .close { margin-left: auto; background: none; border: none; color: var(--fg-2); cursor: pointer; border-radius: 8px; padding: 4px 8px; }
.header .close:hover { background: var(--hover); color: var(--fg); }
.search { padding: 8px 16px; background: var(--bg-win); border-bottom: 1px solid var(--line-2); }
.search input { width: 100%; padding: 10px 14px; border-radius: 8px; background: var(--bg-side); border: 1px solid var(--line-2); color: var(--fg); font-size: 13px; }
.walls { overflow-y: auto; padding: 8px 0; }
.wall-item { display: flex; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background var(--t-fast); }
.wall-item:hover { background: var(--hover); }
.wall-item img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex: none; }
.wall-item .t { flex: 1; overflow: hidden; }
.wall-item .t b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wall-item .t small { display: block; color: var(--fg-3); font-size: 11px; }
</style></head><body>
<div class="taskview">
  <div class="header">
    <h2>Task View</h2>
    <button class="close" id="close" title="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="search">
    <input id="search" type="text" placeholder="Search windows...">
  </div>
  <div class="walls" id="walls"></div>
</div>
<script>
(function() {
  const L = window.Lumina = {};
  const walls = document.getElementById('walls');
  const search = document.getElementById('search');
  const close = document.getElementById('close');

  L.on('windows', function(ws) {
    if (ws && ws.length) {
      walls.innerHTML = ws.map(w => `
        <div class="wall-item" data-xid="${w.xid}">
          <img src="${w.icon || '/ui/img/app-generic.svg'}">
          <div class="t"><b>${L.esc(w.title || 'Untitled')}</b><small>${L.esc(w.app || '')}</small></div>
        </div>`).join('');
      walls.querySelectorAll('.wall-item').forEach(item => {
        item.onclick = () => L.post('/api/window', { xid: parseInt(item.dataset.xid), action: 'activate' });
      });
    }
  });

  close.onclick = () => { window.parent && window.parent.L && window.parent.L.native('taskview', { show: false }); };

  search.onkeydown = e => { if (e.key === 'Escape') close.click(); };
})();
</script></body></html>
