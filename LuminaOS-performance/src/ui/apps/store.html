<!DOCTYPE html>
<html class="dark"><head><meta charset="utf-8"><title>Lumina Store</title>
<link rel="stylesheet" href="/ui/css/lumina.css"><link rel="stylesheet" href="/ui/css/window.css">
<style>
.titlebar .tt { min-width: 90px; }
#tbslot { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); width: 420px; }
#q { width: 100%; height: 28px; padding-left: 32px; border-radius: 14px; }
.qi { position: absolute; left: 11px; top: 7px; width: 14px; height: 14px; color: var(--fg-3); }
.rail { width: 72px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 10px; }
.rail .r { width: 60px; padding: 7px 0 6px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--fg-2);
  position: relative; transition: background var(--t-fast); }
.rail .r svg { width: 19px; height: 19px; transition: transform var(--t) var(--spring); }
.rail .r:hover { background: var(--hover); } .rail .r:active svg { transform: scale(.85); }
.rail .r.on { background: var(--sel); color: var(--fg); }
.rail .r.on::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--accent); animation: navBar 300ms var(--spring); }
.rail .r.on svg { color: var(--accent); }
.rail .sp { flex: 1; }
.rail .badge { position: absolute; top: 3px; right: 12px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }
.pane { flex: 1; min-width: 0; overflow-y: auto; border-top-left-radius: 10px; background: var(--card); border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 22px 30px 30px; }
.page { animation: pageIn 380ms var(--spring-soft) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
h2 { font-size: 20px; font-weight: 600; margin: 0 0 14px; } h3 { font-size: 15px; font-weight: 600; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
h3 a { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--accent); cursor: default; }
.hero { position: relative; height: 230px; border-radius: 14px; overflow: hidden; }
.slide { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 40px; gap: 30px; opacity: 0; transform: scale(1.03); transition: opacity 600ms, transform 900ms var(--ease-out); }
.slide.on { opacity: 1; transform: none; z-index: 1; }
.slide img { width: 120px; height: 120px; filter: drop-shadow(0 12px 22px rgba(0,0,0,.35)); }
.slide .tx { color: #fff; max-width: 460px; }
.slide .tx small { text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; opacity: .8; }
.slide .tx h1 { margin: 4px 0 6px; font-size: 30px; letter-spacing: -.02em; }
.slide .tx p { margin: 0 0 14px; opacity: .88; line-height: 1.5; }
.slide .tx .btn { background: rgba(255,255,255,.95); color: #111; border: 0; }
.hdots { position: absolute; bottom: 12px; left: 40px; display: flex; gap: 6px; z-index: 2; }
.hdots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.5); transition: width var(--t) var(--spring); }
.hdots i.on { width: 20px; background: #fff; }
.cats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.chip { height: 32px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center; gap: 7px; background: var(--card-a); border: 1px solid var(--line); font-size: 12.5px;
  transition: transform var(--t-fast) var(--spring), background var(--t-fast); }
.chip svg { width: 15px; height: 15px; color: var(--accent); } .chip:hover { background: var(--card-h); transform: translateY(-2px); } .chip.on { background: var(--accent); color: #fff; border-color: transparent; } .chip.on svg { color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.ac { display: flex; gap: 12px; padding: 12px; border-radius: 10px; background: var(--card-a); border: 1px solid var(--line); align-items: center;
  transition: transform var(--t) var(--spring), background var(--t-fast), box-shadow var(--t); animation: cardIn 420ms var(--spring-soft) both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.ac:hover { background: var(--card-h); transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.18); }
.ac img { width: 48px; height: 48px; flex: none; transition: transform var(--t) var(--spring); } .ac:hover img { transform: scale(1.08) rotate(-3deg); }
.ac .t { flex: 1; min-width: 0; } .ac b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac small { color: var(--fg-3); font-size: 11.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.ac .tag { font-size: 10.5px; color: var(--fg-3); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
.ac .tag .ok { color: #30d158; }
.ib { flex: none; }
.ib .btn { height: 28px; padding: 0 12px; font-size: 12px; min-width: 70px; justify-content: center; }
.ring { width: 28px; height: 28px; position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3; } .ring .bg { stroke: var(--fg-4); } .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 400ms var(--ease-out); }
.ring.ind svg { animation: spin 1s linear infinite; }
.ring span { font-size: 8.5px; font-weight: 600; }
/* detail page */
.det { display: flex; gap: 26px; align-items: center; padding: 22px; border-radius: 14px; background: linear-gradient(135deg, rgba(var(--accent-rgb), .22), transparent 70%), var(--card-a); border: 1px solid var(--line); }
.det img { width: 110px; height: 110px; animation: popIn 520ms var(--spring) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.6) rotate(-10deg); } }
.det h1 { margin: 0 0 4px; font-size: 26px; } .det p { color: var(--fg-2); margin: 0 0 14px; line-height: 1.5; max-width: 520px; }
.det .acts { display: flex; gap: 8px; align-items: center; }
.det .prog { width: 260px; height: 4px; border-radius: 2px; background: var(--fg-4); overflow: hidden; margin-top: 12px; display: none; }
.det .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 400ms var(--ease-out); }
.det .last { font-size: 11px; color: var(--fg-3); margin-top: 6px; max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.facts .card { padding: 12px 14px; } .facts small { color: var(--fg-3); font-size: 11px; display: block; } .facts b { font-weight: 600; }
.note { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(255,159,10,.12); border: 1px solid rgba(255,159,10,.3); font-size: 12.5px; line-height: 1.5; }
/* essentials sheet */
.ess { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.ess label { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--card-a); border: 1px solid var(--line); transition: border-color var(--t-fast), background var(--t-fast); }
.ess label:has(input:checked) { border-color: var(--accent); background: rgba(var(--accent-rgb), .1); }
.ess img { width: 32px; height: 32px; } .ess input { accent-color: var(--accent); }
.joblist .row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--card-a); border: 1px solid var(--line); margin-bottom: 8px; }
.joblist .row .t { flex: 1; min-width: 0; } .joblist .row small { color: var(--fg-3); font-size: 11.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--fg-3); text-align: center; padding: 40px; }
.filepg { text-align: center; padding: 40px 20px; }
.filepg img { width: 96px; height: 96px; }
</style></head>
<body><nav class="rail" id="rail"></nav><div class="pane" id="pane"></div>
<script src="/ui/js/lumina.js"></script><script src="/ui/js/window.js"></script>
<script>
const L = Lumina, $ = s => document.querySelector(s);
let CAT = { apps: [], categories: [] }, JOBS = {}, page = 'home', cur = null;
const ico = a => a.icon.startsWith('/') ? a.icon : '/api/icon?size=128&name=' + encodeURIComponent(a.icon);
const byId = id => CAT.apps.find(a => a.id === id);
const HERO = [
  { id: 'libreoffice', g: 'linear-gradient(120deg,#1d7a4f,#0f4c81)', k: 'Productivity', t: 'Office, ready to go', d: 'Open and edit Word, Excel and PowerPoint files with LibreOffice.' },
  { id: 'wine', g: 'linear-gradient(120deg,#7a1d3a,#3a1d7a)', k: 'Compatibility', t: 'Your Windows apps', d: 'Install Wine and double-click .exe or .msi files to run many Windows programs.' },
  { id: 'steam', g: 'linear-gradient(120deg,#1b2838,#2a475e)', k: 'Games', t: 'Play on LuminaOS', d: 'Steam with Proton runs thousands of Windows games.' },
  { id: 'vlc', g: 'linear-gradient(120deg,#e85d04,#9d0208)', k: 'Music & Video', t: 'Plays everything', d: 'VLC handles nearly every video and audio format.' },
];
const RAIL = [['home', 'home', 'Home'], ['apps', 'apps', 'Apps'], ['games', 'rocket', 'Games'], ['essentials', 'sparkle', 'Essentials'], ['sp'], ['library', 'bag', 'Library']];

function drawRail() {
  const running = Object.values(JOBS).filter(j => j.state === 'running').length;
  $('#rail').innerHTML = RAIL.map(([id, ic, n]) => id === 'sp' ? '<div class="sp"></div>' :
    `<div class="r ${page === id ? 'on' : ''}" data-p="${id}">${L.icon(ic)}<span>${n}</span>${id === 'library' && running ? `<span class="badge">${running}</span>` : ''}</div>`).join('');
  $('#rail').querySelectorAll('.r').forEach(r => r.onclick = () => go(r.dataset.p));
}
function jobFor(a) { return Object.values(JOBS).filter(j => j.state === 'running' && j.names.includes(a.name)).pop(); }
function btnFor(a) {
  const j = jobFor(a);
  if (j) {
    const p = j.progress || 0, c = 2 * Math.PI * 11;
    return `<div class="ring ${p ? '' : 'ind'}"><svg viewBox="0 0 28 28"><circle class="bg" cx="14" cy="14" r="11"/><circle class="fg" cx="14" cy="14" r="11" stroke-dasharray="${c}" stroke-dashoffset="${p ? c * (1 - p / 100) : c * .7}"/></svg><span>${p ? Math.round(p) : ''}</span></div>`;
  }
  return a.installed ? `<button class="btn" data-open="${a.id}">Open</button>` : `<button class="btn primary" data-get="${a.id}">Get</button>`;
}
function card(a, k) {
  return `<div class="ac" data-id="${a.id}" style="animation-delay:${Math.min(k, 16) * 25}ms"><img src="${ico(a)}"><div class="t"><b>${L.esc(a.name)}</b><small>${L.esc(a.desc)}</small>
    <div class="tag">${a.installed ? `<span class="ok">${L.icon('check')}</span>Installed` : (a.kind === 'flatpak' ? 'Flathub' : a.kind === 'android' ? 'Experimental' : 'Debian')}</div></div><div class="ib">${btnFor(a)}</div></div>`;
}
function bindCards(root) {
  root.querySelectorAll('.ac').forEach(c => c.onclick = e => {
    const g = e.target.closest('[data-get]'), o = e.target.closest('[data-open]');
    if (g) { e.stopPropagation(); install([g.dataset.get]); return; }
    if (o) { e.stopPropagation(); openApp(byId(o.dataset.open)); return; }
    detail(c.dataset.id);
  });
}
function refreshButtons() {
  document.querySelectorAll('.ac').forEach(c => { const a = byId(c.dataset.id); if (a) c.querySelector('.ib').innerHTML = btnFor(a); });
  if (page === 'detail' && cur) drawDetailActs();
  if (page === 'library') drawLibrary();
  drawRail();
}
async function install(ids, remove) {
  const apps = ids.map(byId).filter(Boolean);
  if (!apps.length) return;
  if (!remove && apps.some(a => a.kind === 'android')) {
    const c = await L.get('/api/compat');
    if (!c.binder && !(await L.dialog({ title: 'Android support is experimental', text: 'Waydroid needs the binder kernel feature and works best on an installed system (not the live ISO). Continue anyway?', buttons: ['Continue', 'Cancel'] }))) return;
  }
  const j = await L.post('/api/store/install', { ids, remove: !!remove });
  JOBS[j.id] = j; refreshButtons();
}
function openApp(a) {
  if (!a) return;
  L.get('/api/apps').then(list => {
    const k = a.name.toLowerCase().split(' ')[0], m = list.find(x => x.name.toLowerCase().includes(k) || (x.id || '').toLowerCase().includes(a.pkg.toLowerCase()));
    if (m) L.post('/api/launch', { id: m.id }); else L.notify(a.name + ' is installed', 'Find it in Start and Launchpad.', 'lumina-store', 'Lumina Store');
  });
}
function go(p, arg) {
  page = p; drawRail();
  const pane = $('#pane'); pane.scrollTop = 0;
  if (p === 'home') drawHome();
  else if (p === 'apps') drawList(null, arg);
  else if (p === 'games') drawList('games');
  else if (p === 'essentials') drawEssentials();
  else if (p === 'library') drawLibrary();
}
let heroT = null, heroI = 0;
function drawHome() {
  const pane = $('#pane');
  const hero = HERO.map(h => ({ ...h, a: byId(h.id) })).filter(h => h.a);
  pane.innerHTML = `<div class="page"><div class="hero" id="hero">${hero.map((h, k) => `<div class="slide ${k === heroI % hero.length ? 'on' : ''}" style="background:${h.g}" data-id="${h.id}"><img src="${ico(h.a)}"><div class="tx"><small>${h.k}</small><h1>${h.t}</h1><p>${h.d}</p><button class="btn">${h.a.installed ? 'Open' : 'Get ' + L.esc(h.a.name)}</button></div></div>`).join('')}
    <div class="hdots">${hero.map((_, k) => `<i data-k="${k}" class="${k === heroI % hero.length ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="cats">${CAT.categories.map(c => `<div class="chip" data-c="${c.id}">${L.icon(c.icon)}${c.name}</div>`).join('')}</div>
    <h3>Essentials for your new PC <a id="seeEss">Pick several ›</a></h3><div class="grid" id="g1">${CAT.apps.filter(a => a.essential).map(card).join('')}</div>
    <h3>Top free apps <a id="seeAll">See all ›</a></h3><div class="grid" id="g2">${CAT.apps.filter(a => !a.essential && a.category !== 'games').slice(0, 9).map(card).join('')}</div>
    <h3>Games <a id="seeG">See all ›</a></h3><div class="grid" id="g3">${CAT.apps.filter(a => a.category === 'games').map(card).join('')}</div></div>`;
  bindCards(pane);
  pane.querySelectorAll('.chip').forEach(c => c.onclick = () => go('apps', c.dataset.c));
  $('#seeEss').onclick = () => go('essentials'); $('#seeAll').onclick = () => go('apps'); $('#seeG').onclick = () => go('games');
  pane.querySelectorAll('.slide').forEach(s => s.onclick = e => { const a = byId(s.dataset.id); if (e.target.closest('.btn')) { a.installed ? openApp(a) : install([a.id]); } else detail(a.id); });
  const show = k => { heroI = k; pane.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('on', i === k % hero.length)); pane.querySelectorAll('.hdots i').forEach((s, i) => s.classList.toggle('on', i === k % hero.length)); };
  pane.querySelectorAll('.hdots i').forEach(d => d.onclick = e => { e.stopPropagation(); show(+d.dataset.k); });
  clearInterval(heroT); heroT = setInterval(() => page === 'home' && show(heroI + 1), 6000);
}
function drawList(cat, sel) {
  sel = sel || cat;
  const q = ($('#q').value || '').trim().toLowerCase();
  const list = CAT.apps.filter(a => (!sel || a.category === sel) && (!q || (a.name + ' ' + a.desc + ' ' + a.pkg).toLowerCase().includes(q)));
  $('#pane').innerHTML = `<div class="page"><h2>${q ? `Results for “${L.esc(q)}”` : cat === 'games' ? 'Games' : 'Apps'}</h2>
    ${cat !== 'games' ? `<div class="cats" style="margin:0 0 16px"><div class="chip ${!sel ? 'on' : ''}" data-c="">${L.icon('apps')}All</div>${CAT.categories.map(c => `<div class="chip ${sel === c.id ? 'on' : ''}" data-c="${c.id}">${L.icon(c.icon)}${c.name}</div>`).join('')}</div>` : ''}
    <div class="grid">${list.map(card).join('') || '<div class="empty">No apps found.</div>'}</div></div>`;
  bindCards($('#pane'));
  $('#pane').querySelectorAll('.chip').forEach(c => c.onclick = () => { $('#q').value = ''; drawList(null, c.dataset.c || null); });
}
function detail(id) {
  cur = byId(id); if (!cur) return; page = 'detail'; drawRail();
  const a = cur, c = CAT.categories.find(x => x.id === a.category);
  $('#pane').innerHTML = `<div class="page"><button class="btn ghost small" id="back" style="margin-bottom:10px">${L.icon('left')} Back</button>
    <div class="det"><img src="${ico(a)}"><div style="flex:1;min-width:0"><h1>${L.esc(a.name)}</h1><p>${L.esc(a.desc)}</p><div class="acts" id="dacts"></div><div class="prog" id="dprog"><i></i></div><div class="last" id="dlast"></div></div></div>
    <div class="facts"><div class="card"><small>Category</small><b>${c ? c.name : ''}</b></div><div class="card"><small>Source</small><b>${a.kind === 'flatpak' ? 'Flathub' : a.kind === 'android' ? 'Waydroid repo' : 'Debian'}</b></div>
    <div class="card"><small>Package</small><b>${L.esc(a.pkg)}</b></div><div class="card"><small>Price</small><b>Free</b></div></div>
    ${a.kind === 'android' ? `<div class="note">Android support is experimental. Waydroid runs a full Android system in a container and needs the <b>binder</b> kernel module and a Wayland session (Lumina starts one for Android apps). It is not available in the live ISO session.</div>` : ''}
    ${a.id === 'wine' ? `<div class="note">Wine runs many, but not all, Windows programs. Check compatibility at appdb.winehq.org. After installing, double-click any .exe or .msi in Files.</div>` : ''}
    <h3>You may also like</h3><div class="grid">${CAT.apps.filter(x => x.category === a.category && x.id !== a.id).slice(0, 6).map(card).join('')}</div></div>`;
  $('#back').onclick = () => go('home');
  bindCards($('#pane')); drawDetailActs();
}
function drawDetailActs() {
  const a = cur, j = jobFor(a), el = $('#dacts'); if (!el) return;
  if (j) {
    el.innerHTML = `<div class="spinner"></div><span>${j.remove ? 'Removing' : 'Installing'}… ${j.progress ? Math.round(j.progress) + '%' : ''}</span>`;
    $('#dprog').style.display = 'block'; $('#dprog i').style.width = (j.progress || 3) + '%'; $('#dlast').textContent = j.last || 'Preparing…';
  } else {
    $('#dprog').style.display = 'none'; $('#dlast').textContent = '';
    el.innerHTML = a.installed ? `<button class="btn primary" id="dopen">Open</button><button class="btn" id="drm">${L.icon('trash')} Uninstall</button>` : `<button class="btn primary" id="dget">${L.icon('download')} Install</button>`;
    if ($('#dopen')) $('#dopen').onclick = () => openApp(a);
    if ($('#drm')) $('#drm').onclick = async () => { if (await L.dialog({ title: 'Uninstall ' + a.name + '?', text: 'The app will be removed. Your files are kept.', buttons: ['Uninstall', 'Cancel'] })) install([a.id], true); };
    if ($('#dget')) $('#dget').onclick = () => install([a.id]);
  }
}
function drawEssentials() {
  const list = CAT.apps.filter(a => !a.installed && a.kind !== 'android');
  $('#pane').innerHTML = `<div class="page"><h2>Essentials pack</h2><p style="color:var(--fg-2);margin:-6px 0 16px">Pick the apps you want and install them all in one go.</p>
    <div class="ess">${list.map(a => `<label><input type="checkbox" value="${a.id}" ${a.essential ? 'checked' : ''}><img src="${ico(a)}"><span>${L.esc(a.name)}</span></label>`).join('') || '<div class="empty">Everything is already installed.</div>'}</div>
    <div style="display:flex;gap:8px;margin-top:18px;align-items:center"><button class="btn primary" id="essGo">${L.icon('download')} Install selected</button><span id="essN" style="color:var(--fg-3)"></span></div></div>`;
  const upd = () => { const n = $('#pane').querySelectorAll('input:checked').length; $('#essN').textContent = n + ' selected'; $('#essGo').disabled = !n; };
  $('#pane').querySelectorAll('input').forEach(i => i.onchange = upd); upd();
  $('#essGo').onclick = () => { install([...$('#pane').querySelectorAll('input:checked')].map(i => i.value)); go('library'); };
}
function drawLibrary() {
  const jobs = Object.values(JOBS).filter(j => j.kind !== 'update').reverse();
  const inst = CAT.apps.filter(a => a.installed);
  const pane = $('#pane'), st = pane.scrollTop;
  pane.innerHTML = `<div class="page" style="animation:none"><h2>Library</h2>
    <h3 style="margin-top:0">Downloads and updates <a id="upd">Get updates ›</a></h3><div class="joblist">${jobs.map(j => `<div class="row">${j.state === 'running' ? '<div class="spinner"></div>' : j.state === 'done' ? `<span style="color:#30d158">${L.icon('check')}</span>` : `<span style="color:#ff453a">${L.icon('x')}</span>`}
      <div class="t"><b>${L.esc(j.names.join(', ') || 'Package')}</b><small>${j.state === 'running' ? (j.remove ? 'Removing' : 'Installing') + (j.progress ? ' · ' + Math.round(j.progress) + '%' : '') + ' · ' + L.esc(j.last || 'Preparing…') : j.state === 'done' ? (j.remove ? 'Removed' : 'Installed') : 'Failed: ' + L.esc(j.last || '')}</small></div></div>`).join('') || '<div class="empty" style="padding:16px">No recent activity.</div>'}</div>
    <h3>Installed from the Store</h3><div class="grid">${inst.map(card).join('') || '<div class="empty">Nothing yet.</div>'}</div>
    <h3>Install any app package</h3><button class="btn" id="pick">${L.icon('folder')} Open Files and double-click any .exe, .deb, .AppImage, .flatpak, or .rpm</button></div>`;
  pane.scrollTop = st; bindCards(pane);
  $('#upd').onclick = () => L.app('settings', ['update']);
  $('#pick').onclick = () => L.app('files', ['home:']);
}
async function filePage(f) {
  page = 'file'; drawRail();
  const n = f.split('/').pop();
  $('#pane').innerHTML = `<div class="page filepg"><img src="/ui/img/apps/store.svg"><h2 style="margin-top:14px">Install ${L.esc(n)}?</h2><p style="color:var(--fg-2)">${L.esc(f)}</p>
    <p style="color:var(--fg-3);font-size:12px;max-width:440px;margin:0 auto 16px">Lumina opens Windows apps through Wine, Android APKs through Waydroid, and Linux packages through the appropriate package manager.</p>
    <button class="btn primary" id="fgo">${L.icon('download')} Install</button> <button class="btn" id="fno">Cancel</button><div id="fst" style="margin-top:14px;color:var(--fg-3)"></div></div>`;
  $('#fno').onclick = () => go('home');
  $('#fgo').onclick = async () => { const j = await L.post('/api/store/install', { ids: [], file: f }); j.names = [n]; JOBS[j.id] = j; go('library'); };
}
async function uninstallPage(desk) {
  const o = await L.get('/api/store/owner', { desktop: desk });
  if (!o.pkg) { await L.dialog({ title: "Can't uninstall " + o.name, text: 'This app is part of LuminaOS or was not installed from a package.', buttons: ['OK'] }); return go('library'); }
  if (await L.dialog({ title: 'Uninstall ' + o.name + '?', text: `Package “${o.pkg}” will be removed. Your files are kept.`, buttons: ['Uninstall', 'Cancel'] })) {
    const j = await L.post('/api/store/install', { ids: [], pkgs: [o.pkg], remove: true }); j.names = [o.name]; JOBS[j.id] = j;
  }
  go('library');
}
function handleArgs(a) {
  a = (a || []).map(x => x.startsWith('file://') ? decodeURIComponent(x.slice(7)) : x);
  if (a[0] && /\.(deb|flatpakref|flatpak|appimage|snap|rpm|exe|msi|apk)$/i.test(a[0])) return filePage(a[0]);
  if (a[0] === '--install-file' && a[1]) return filePage(a[1]);
  if (a[0] === '--android') return detail('waydroid');
  if (a[0] === '--uninstall' && a[1]) return uninstallPage(a[1]);
  if (a[0] === '--essentials') return go('essentials');
  if (a[0] === '--library') return go('library');
  if (a[0] && byId(a[0])) return detail(a[0]);
  go(page === 'detail' || page === 'file' ? 'home' : page);
}
LWin.init({ icon: '/ui/img/apps/store.svg', titlebar: `<div id="tbslot"><svg class="qi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" id="q" placeholder="Search apps and games"></div>`, onArgs: handleArgs }).then(async () => {
  [CAT] = await Promise.all([L.get('/api/store')]);
  (await L.get('/api/store/jobs')).forEach(j => JOBS[j.id] = j);
  let qt; $('#q').oninput = () => { clearTimeout(qt); qt = setTimeout(() => { page = 'apps'; drawRail(); drawList(); }, 180); };
  L.on('job', j => { const was = JOBS[j.id]; JOBS[j.id] = Object.assign(was || {}, j);
    if (j.state !== 'running') L.get('/api/store').then(c => { CAT = c; if (page === 'detail' && cur) cur = byId(cur.id); refreshButtons(); }); else refreshButtons(); });
  document.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'f') { e.preventDefault(); $('#q').focus(); } });
  handleArgs(LWin.args);
});
</script></body></html>
