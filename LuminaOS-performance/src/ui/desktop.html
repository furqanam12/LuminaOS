<!doctype html>
<html class="dark"><head><meta charset="utf-8"><title>Desktop</title>
<link rel="stylesheet" href="css/lumina.css">
<style>
  body { background: #0b0b10; }
  .wall { position: fixed; inset: 0; background-size: cover; background-position: center; opacity: 0;
    transition: opacity 900ms ease, transform 1400ms var(--ease-out); transform: scale(1.06); }
  .wall.on { opacity: 1; transform: none; }
  #icons { position: fixed; z-index: 5; top: 44px; left: 14px; bottom: 90px; display: grid; grid-auto-flow: column;
    grid-template-rows: repeat(auto-fill, 96px); grid-auto-columns: 88px; gap: 4px; }
  .di { width: 88px; height: 96px; display: flex; flex-direction: column; align-items: center; padding-top: 6px; border-radius: 8px;
    border: 1px solid transparent; transition: background var(--t-fast); animation: popIn 420ms var(--spring) both; }
  .di:hover { background: rgba(255,255,255,.12); }
  .di.sel { background: rgba(var(--accent-rgb), .28); border-color: rgba(var(--accent-rgb), .55); }
  .di img { width: 48px; height: 48px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .di span { margin-top: 5px; font-size: 12px; color: #fff; text-align: center; line-height: 1.25; max-width: 84px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-shadow: 0 1px 3px rgba(0,0,0,.8); word-break: break-word; }
  #widget { position: fixed; z-index: 5; right: 28px; top: 54px; width: 300px; padding: 20px 22px; border-radius: 22px; color: #fff;
    background: rgba(20,20,28,.32); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 40px rgba(0,0,0,.25);
    display: none; animation: riseIn 600ms var(--spring-soft) both; }
  #widget.on { display: block; }
  #widget .t { font-size: 56px; font-weight: 200; letter-spacing: -.02em; line-height: 1; }
  #widget .d { font-size: 14px; opacity: .85; margin-top: 8px; }
  #widget .s { display: flex; gap: 14px; margin-top: 16px; font-size: 12px; opacity: .85; }
  #widget .s div { flex: 1; background: rgba(255,255,255,.1); border-radius: 12px; padding: 8px 10px; }
  #widget .s b { display: block; font-size: 17px; font-weight: 500; margin-top: 2px; }
  #boot { position: fixed; inset: 0; background: #000; display: grid; place-items: center; z-index: 10; transition: opacity 700ms ease 200ms; }
  #boot img { width: 72px; animation: popIn 700ms var(--spring); }
  #boot.gone { opacity: 0; pointer-events: none; }
  #rubber { position: fixed; z-index: 6; border: 1px solid rgba(var(--accent-rgb), .9); background: rgba(var(--accent-rgb), .18); border-radius: 3px; display: none; }
</style></head>
<body>
<div class="wall" id="w1"></div><div class="wall" id="w2"></div>
<div id="icons"></div>
<div id="widget"><div class="t" id="wt">--:--</div><div class="d" id="wd"></div>
  <div class="s"><div>CPU<b id="wc">0%</b></div><div>Memory<b id="wm">0%</b></div></div></div>
<div id="rubber"></div>
<div id="boot"><img src="img/apps/logo.svg"></div>
<script src="js/lumina.js"></script>
<script>
const L = Lumina;
let cur = null, front = 'w1', desktopPath = null, sel = new Set();
let desktopPathResolved = false, iconsLoading = false, iconsReloadPending = false, iconsForcePending = false, iconsSignature = null;
let widgetTickTimer = null, widgetStatsTimer = null, widgetStatsDelay = 0, statsLoading = false, statsRefreshPending = false;
function setWall(name) {
  if (name === cur) return; cur = name;
  const url = '/api/wallpaper/file?name=' + encodeURIComponent(name);
  const img = new Image();
  img.onload = () => {
    const back = front === 'w1' ? 'w2' : 'w1';
    const b = document.getElementById(back), f = document.getElementById(front);
    b.style.backgroundImage = `url("${url}")`; b.style.zIndex = 1; f.style.zIndex = 0;
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    setTimeout(() => f.classList.remove('on'), 950);
    front = back;
    document.getElementById('boot').classList.add('gone');
  };
  img.onerror = () => document.getElementById('boot').classList.add('gone');
  img.src = url;
}
const ICONMAP = { folder: 'files', 'inode/directory': 'files' };
function fileIcon(f) {
  if (f.dir) return '/ui/img/apps/files.svg';
  if (f.desktopApp) return L.appIcon(f.desktopApp);
  if (/^image\//.test(f.mime || '')) return '/api/fs/thumb?size=96&path=' + encodeURIComponent(f.path);
  return '/api/icon?size=96&name=' + encodeURIComponent((f.mime || 'text/plain').replace('/', '-'));
}
async function loadIcons(force = false) {
  if (iconsLoading) { iconsReloadPending = true; iconsForcePending = iconsForcePending || force === true; return; }
  iconsLoading = true;
  if (force === true) iconsSignature = null;
  try {
    if (!desktopPathResolved) {
      const places = await L.get('/api/fs/places');
      const d = places.places.find(p => p.icon === 'desktop');
      desktopPath = d ? d.path : null;
      desktopPathResolved = true;
    }
    const box = document.getElementById('icons');
    const items = [{ name: 'This PC', icon: '/ui/img/apps/disks.svg', open: () => L.app('files', ['computer:']) },
                   { name: 'Trash', icon: '/ui/img/apps/trash.svg', open: () => L.app('files', ['trash:']) }];
    if (desktopPath) {
      const r = await L.get('/api/fs/list', { path: desktopPath });
      (r.items || []).forEach(f => items.push({ name: f.name, icon: fileIcon(f), path: f.path,
        metadata: [f.size, f.mtime, f.mime, !!f.dir], open: () => L.post('/api/fs/open', { path: f.path }) }));
    }
    const signature = JSON.stringify(items.map(it => JSON.stringify([it.name, it.path, it.icon, it.metadata])).sort());
    if (signature === iconsSignature) return;
    box.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'di'; el.style.animationDelay = (i * 30) + 'ms';
      el.innerHTML = `<img src="${L.esc(it.icon)}" onerror="this.src='/ui/img/apps/files.svg'"><span>${L.esc(it.name)}</span>`;
      el.onmousedown = (e) => { e.stopPropagation(); if (!e.ctrlKey) { document.querySelectorAll('.di.sel').forEach(x => x.classList.remove('sel')); } el.classList.add('sel'); };
      el.ondblclick = () => it.open();
      el.oncontextmenu = (e) => {
        e.preventDefault(); e.stopPropagation();
        L.menu(e.clientX, e.clientY, [
          { label: 'Open', icon: 'external', action: it.open },
          ...(it.path ? [{ label: 'Rename', icon: 'rename', action: async () => {
              const n = await L.dialog({ title: 'Rename', input: 'text', value: it.name, buttons: ['Rename', 'Cancel'], parent: document.body });
              if (n) { await L.post('/api/fs/rename', { path: it.path, name: n }); loadIcons(); } } },
            { label: 'Move to Trash', icon: 'trash', danger: true, action: async () => { await L.post('/api/fs/trash', { paths: [it.path] }); loadIcons(); } }] : []),
        ]);
      };
      box.appendChild(el);
    });
    iconsSignature = signature;
  } catch (e) { /* Keep existing icons on transient filesystem errors. */ }
  finally {
    iconsLoading = false;
    if (iconsReloadPending) {
      const force = iconsForcePending;
      iconsReloadPending = false; iconsForcePending = false;
      loadIcons(force);
    }
  }
}
document.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  document.querySelectorAll('.di.sel').forEach(x => x.classList.remove('sel'));
  const r = document.getElementById('rubber'); const sx = e.clientX, sy = e.clientY;
  const mv = (ev) => {
    const x = Math.min(sx, ev.clientX), y = Math.min(sy, ev.clientY), w = Math.abs(ev.clientX - sx), h = Math.abs(ev.clientY - sy);
    Object.assign(r.style, { display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    document.querySelectorAll('.di').forEach(d => { const b = d.getBoundingClientRect();
      d.classList.toggle('sel', b.right > x && b.left < x + w && b.bottom > y && b.top < y + h); });
  };
  const up = () => { r.style.display = 'none'; removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
  addEventListener('mousemove', mv); addEventListener('mouseup', up);
});
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  L.menu(e.clientX, e.clientY, [
    { label: 'View', icon: 'grid', disabled: true },
    { label: 'Refresh', icon: 'refresh', action: () => loadIcons(true) },
    '-',
    { label: 'New folder', icon: 'folder', action: async () => { if (desktopPath) { await L.post('/api/fs/mkdir', { path: desktopPath }); loadIcons(); } } },
    { label: 'New text document', icon: 'filetext', action: async () => { if (desktopPath) { await L.post('/api/fs/newfile', { path: desktopPath }); loadIcons(); } } },
    '-',
    { label: 'Open in Terminal', icon: 'terminal', action: () => L.post('/api/run', { cmd: 'cd "$(xdg-user-dir DESKTOP)" && x-terminal-emulator' }) },
    { label: 'Show desktop widgets', icon: 'layout', kbd: L.settings.widgets ? '✓' : '', action: () => L.setSettings({ widgets: !L.settings.widgets }) },
    '-',
    { label: 'Display settings', icon: 'monitor', action: () => L.app('settings', ['display']) },
    { label: 'Personalise', icon: 'palette', action: () => L.app('settings', ['personalisation']) },
  ]);
});
function tick() {
  if (!L.settings.widgets) return;
  const d = new Date();
  document.getElementById('wt').textContent = L.time(d);
  document.getElementById('wd').textContent = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
}
async function stats() {
  if (!L.settings.widgets) return;
  if (statsLoading) { statsRefreshPending = true; return; }
  statsLoading = true;
  try {
    const s = await L.get('/api/stats');
    if (!L.settings.widgets) return;
    document.getElementById('wc').textContent = Math.round(s.cpu) + '%';
    document.getElementById('wm').textContent = Math.round(s.mem.percent) + '%';
  } catch (e) { /* Keep the last sample until the next refresh. */ }
  finally {
    statsLoading = false;
    if (statsRefreshPending) { statsRefreshPending = false; stats(); }
  }
}
function apply(s) {
  setWall(s.wallpaper); document.getElementById('widget').classList.toggle('on', !!s.widgets);
  if (!s.widgets) {
    clearInterval(widgetTickTimer); clearInterval(widgetStatsTimer);
    widgetTickTimer = null; widgetStatsTimer = null; widgetStatsDelay = 0;
    return;
  }
  tick();
  if (widgetTickTimer === null) widgetTickTimer = setInterval(tick, 1000);
  const delay = s.performancePreset === 'low-power' ? 10000 : 3000;
  if (widgetStatsTimer === null || widgetStatsDelay !== delay) {
    clearInterval(widgetStatsTimer); widgetStatsDelay = delay;
    widgetStatsTimer = setInterval(stats, delay); stats();
  }
}
L.init().then(s => { apply(s); loadIcons(); setInterval(loadIcons, 15000); });
L.on('settings', apply);
L.on('ui', m => { if (m.cmd === 'desktop-refresh') loadIcons(true); });
</script></body></html>
