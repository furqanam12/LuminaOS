insmod all_video
insmod gfxterm
insmod png
loadfont unicode
set gfxmode=1920x1080,1280x800,1024x768,auto
set gfxpayload=keep
terminal_output gfxterm
loadfont /boot/grub/themes/lumina/inter-22.pf2
loadfont /boot/grub/themes/lumina/inter-16.pf2
set theme=/boot/grub/themes/lumina/theme.txt
set timeout=6
set default=0

menuentry "Start LuminaOS" {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 username=lumina hostname=luminaos
    initrd /live/initrd.img
}
menuentry "Start LuminaOS (safe graphics)" {
    linux /live/vmlinuz boot=live components nomodeset username=lumina hostname=luminaos
    initrd /live/initrd.img
}
menuentry "Start LuminaOS (load to RAM)" {
    linux /live/vmlinuz boot=live components toram quiet splash username=lumina hostname=luminaos
    initrd /live/initrd.img
}
