name: host-tests

on:
  push:
    paths:
      - "LuminaOS-performance/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "LuminaOS-performance/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LuminaOS-performance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check psutil
      - name: Source, installer, performance and release tests
        run: |
          python tools/test-features.py
          python tools/test-installer.py
          python tools/test-performance.py
          python tools/test-release.py
      - name: Desktop behavior JavaScript tests
        run: node tools/test-performance.js
      - name: Check live-suite syntax
        run: python -m py_compile tools/test-live.py
